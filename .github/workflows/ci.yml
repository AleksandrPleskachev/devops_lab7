name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: read
jobs:
  build-test:
    name: Build and test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.13', '1.22.12']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/cache@v4
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('go.sum') }}
      - name: Cache status
        run: echo 'Cache hit = ${{ steps.go-cache.outputs.cache-hit }}'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./pkg/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.12'
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
